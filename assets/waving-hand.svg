<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Waving hand</title>
  <desc id="desc">A hand emoji waving from side to side</desc>
  <style>
    .hand { transform-origin: 46px 50px; animation: wave 1.6s ease-in-out infinite; }
    @keyframes wave {
      0%, 100% { transform: rotate(0deg); }
      12% { transform: rotate(18deg); }
      24% { transform: rotate(-10deg); }
      36% { transform: rotate(18deg); }
      48% { transform: rotate(-6deg); }
      60% { transform: rotate(12deg); }
      72%, 100% { transform: rotate(0deg); }
    }
    @media (prefers-reduced-motion: reduce) { .hand { animation: none; } }
  </style>
  <g class="hand">
    <text x="4" y="54" font-size="54" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif">👋</text>
  </g>
</svg>
